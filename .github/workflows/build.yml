name: Build and Test Docker Image

on:
  push:
    branches:
      - main
      
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-web-app:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 8080:80 --name my-web-app my-web-app:${{ github.sha }}

      - name: Test website
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080; then
              echo "Website is live!"
              exit 0
            fi

            echo "Waiting for website..."
            sleep 2
          done

          echo "Website failed to start"
          docker logs my-web-app
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::559994392889:role/github-actions-ecr-role
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Stop container
        run: docker stop my-web-app