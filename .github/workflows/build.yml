name: Build and Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-web-app:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 8080:80 --name my-web-app my-web-app:${{ github.sha }}

      - name: Test website
        run: curl --fail http://localhost:8080

      - name: Stop container
        run: docker stop my-web-app
